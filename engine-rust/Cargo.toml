[package]
name = "fortnite-replay-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
reward-probe = []
chest-probe = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8.4"
oozextract = "=0.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
time = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

